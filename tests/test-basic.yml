name: Test basic usage with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy zip file
        run: |
          mkdir -p /tmp/addon
          echo "dummy" > /tmp/addon/manifest.json
          cd /tmp/addon && zip /tmp/addon.zip manifest.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          product-id: "fake-product-id-00000000-0000-0000-0000-000000000000"
          zip-path: "/tmp/addon.zip"
          api-key: "fake-api-key"
          client-id: "fake-client-id"
          upload-only: "true"
          notes-for-certification: "Test notes for certification"
      - name: Assert action ran (credentials are fake so failure is expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, failure expected with fake credentials)"
