name: Test basic usage with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          echo "dummy extension content" > /tmp/extension.zip

      - id: action
        uses: .
        continue-on-error: true
        with:
          product-id: "fake-product-id-12345"
          zip-path: "/tmp/extension.zip"
          api-key: "fake-api-key-for-testing"
          client-id: "fake-client-id-for-testing"
          upload-only: "false"
          notes-for-certification: "Test notes for certification reviewers"

      - name: Assert action ran (expected to fail with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded with fake credentials"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with fake credentials"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: all inputs were accepted by the action"
