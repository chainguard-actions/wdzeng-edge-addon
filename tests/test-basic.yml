name: Test basic input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          mkdir -p /tmp/addon
          echo "dummy content" > /tmp/addon/manifest.json
          cd /tmp/addon && zip /tmp/addon.zip manifest.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          product-id: "fake-product-id-12345"
          zip-path: "/tmp/addon.zip"
          api-key: "fake-api-key-for-testing"
          client-id: "fake-client-id-for-testing"
          upload-only: "true"

      - name: Assert action ran (expected to fail with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure with fake credentials)"
