name: Test publish mode with invalid credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy zip file for publish
        run: |
          echo "dummy content" > /tmp/dummy-addon.zip

      - name: Run action in default publish mode with invalid credentials (expect failure)
        id: action
        uses: .
        with:
          product-id: fake-product-id-12345
          zip-path: /tmp/dummy-addon.zip
          client-id: fake-client-id
          client-secret: fake-client-secret
          access-token-url: https://login.microsoftonline.com/invalid-tenant/oauth2/v2.0/token
          upload-only: "false"
        continue-on-error: true

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials in publish mode, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials in publish mode"
