name: Test publish with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake zip file for testing
        run: |
          echo "fake addon content" > /tmp/fake-addon.zip

      - id: action
        uses: .
        continue-on-error: true
        with:
          product-id: fake-product-id-12345
          zip-path: /tmp/fake-addon.zip
          client-id: fake-client-id
          client-secret: fake-client-secret
          access-token-url: https://login.microsoftonline.com/fake-tenant/oauth2/v2.0/token
          upload-only: "false"

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials during publish"
