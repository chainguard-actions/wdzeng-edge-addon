name: Test with notes-for-certification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          mkdir -p /tmp/addon
          echo "dummy addon content" > /tmp/addon/manifest.json
          cd /tmp/addon && zip /tmp/addon.zip manifest.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          product-id: "fake-product-id-12345"
          zip-path: "/tmp/addon.zip"
          api-key: "fake-api-key"
          client-id: "fake-client-id"
          upload-only: "false"
          notes-for-certification: "This is a test submission for CI purposes."

      - name: Assert action ran with notes-for-certification input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the API level (fake credentials),
          # not at input parsing. This confirms notes-for-certification is accepted.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at API level as expected (notes-for-certification accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
