name: Test upload-only with missing zip file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          product-id: fake-product-id-12345
          zip-path: /nonexistent/path/to/addon.zip
          client-id: invalid-client-id
          client-secret: invalid-client-secret
          access-token-url: https://login.microsoftonline.com/invalid-tenant/oauth2/v2.0/token
          upload-only: "true"
      - name: Assert action failed due to missing zip or invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing zip or invalid credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed"
