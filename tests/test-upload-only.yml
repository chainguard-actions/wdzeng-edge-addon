name: Test upload-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy zip file
        run: |
          echo "dummy" > /tmp/addon.zip
      - id: action
        uses: .
        continue-on-error: true
        with:
          product-id: fake-product-id
          zip-path: /tmp/addon.zip
          client-id: fake-client-id
          client-secret: fake-client-secret
          access-token-url: https://login.microsoftonline.com/fake-tenant/oauth2/v2.0/token
          upload-only: "true"
      - name: Assert action ran (upload attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
