name: Test notes-for-certification optional input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          mkdir -p /tmp/addon
          echo "dummy addon content" > /tmp/addon/manifest.json
          cd /tmp/addon && zip /tmp/addon.zip manifest.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          product-id: "00000000-0000-0000-0000-000000000000"
          zip-path: "/tmp/addon.zip"
          api-key: "fake-api-key-for-testing"
          client-id: "fake-client-id-for-testing"
          upload-only: "false"
          notes-for-certification: "This is a test submission for CI validation."

      - name: Assert action failed with invalid credentials when notes-for-certification is set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials even with notes-for-certification set"
