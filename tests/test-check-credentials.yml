name: Test check-credentials-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          mkdir -p /tmp/addon
          echo "dummy" > /tmp/addon/manifest.json
          cd /tmp/addon && zip /tmp/addon.zip manifest.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          product-id: "fake-product-id-00000000-0000-0000-0000-000000000000"
          zip-path: "/tmp/addon.zip"
          client-id: "fake-client-id"
          client-secret: "fake-client-secret"
          access-token-url: "https://login.microsoftonline.com/fake-tenant/oauth2/v2.0/token"
          check-credentials-only: "true"

      - name: Assert action ran (with expected failure due to fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are fake,
          # but it must have run (not skipped or errored before starting)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected with fake credentials)"
